[package]
name = "uwupulse-setup"
description = "UwUPulse's own installer, updater and uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tar = "0.4"
tauri-build = { version = "2", features = [] }
# zstdmt: the payload compresses on every core (build.rs).
zstd = { version = "0.13", features = ["zstdmt"] }

[dependencies]
semver = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# The OBS plugin (and on macOS and Linux the app) arrives as a folder packed
# as tar (build.rs, payload.rs).
tar = "0.4"
# The setup page's private WebView data folder (app.rs).
tempfile = "3"
zstd = "0.13"

# macOS and Linux: processes are found and ended through the C library.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
