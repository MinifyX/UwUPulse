[package]
name = "uwupulse-obs"
description = "UwUPulse in OBS Studio: the core behind a small C ABI for the plugin in plugins/obs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false
# An rlib for the tests; the plugin's build makes the static library with
# `cargo rustc --crate-type staticlib`, so workspace builds and tests never
# link one.
crate-type = ["rlib"]

[features]
default = ["ble"]
ble = ["uwupulse-core/ble"]

[dependencies]
uwupulse-core.workspace = true
log.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
