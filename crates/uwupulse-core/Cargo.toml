[package]
name = "uwupulse-core"
description = "UwUPulse hub: sources, broadcast, sessions, the local server (link, overlay, API), Bonjour and BLE."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
default = ["ble"]
# Chest straps straight at the desktop (btleplug: CoreBluetooth, WinRT, BlueZ).
# Without it the BLE commands answer "not available" and nothing Bluetooth is
# compiled in, which keeps CI on Linux free of D-Bus headers if needed.
ble = ["dep:btleplug", "dep:futures-util"]

[dependencies]
uwupulse-proto.workspace = true

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
base64.workspace = true
gethostname = "1"
if-addrs = "0.15"
log.workspace = true
mdns-sd = "0.21"
parking_lot.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Bundled SQLite, so the app never depends on whichever sqlite3 is around.
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

btleplug = { version = "0.13", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
