name: Installers

# The workspace checks on macOS (ci.yml covers Linux), and next to
# them, not after them, every file `pnpm release` publishes: the Windows setups
# for x64 and ARM, the universal macOS disk image, and .deb, .rpm and portable
# folder for Linux x64 and arm64. The setups carry the OBS plugin, built by
# obs-plugin.yml in the same run (job `obs`); each setup builds its app first
# and only then waits for its plugin, so the two builds overlap. `pnpm release` takes the run for the commit
# it releases, once all of it finished green. All unsigned: nothing here holds
# the update signing key or any other secret. The files the updater runs are
# signed by `pnpm release`, next to the key, after it downloads them from here.
#
# On main, not on the tag: a tag's run can only read main's caches, so a
# tag-only workflow compiled every dependency from scratch for every release.
# Building on main keeps the caches warm, and by the time the release commit
# is tagged its setups are mostly built.

on:
  push:
    branches:
      - main
      # A branch to try the builds on before merging.
      - 'ci/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apple/**'
  # A release from a commit main didn't build (docs only): run it by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not on main: the next push there would cancel the build of a release
  # commit, and `pnpm release` needs that run green. Main queues instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CARGO_TERM_COLOR: always
  # Tauri runs linuxdeploy, itself an AppImage; runners have no FUSE for it.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  obs:
    name: OBS plugin
    uses: ./.github/workflows/obs-plugin.yml
    permissions:
      contents: read

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Every `uses:` is pinned to a commit, with the version in the comment: a
      # tag can be moved, and `@stable` is a branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build wants every app's frontendDist to exist, and a debug build
      # embeds nothing from it: an empty page each instead of both front ends,
      # which ci.yml builds.
      - name: Front-end placeholders
        run: |
          for app in desktop setup; do
            mkdir -p "apps/$app/dist"
            echo '<!doctype html>' > "apps/$app/dist/index.html"
          done

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-dev
          # Only main saves: the 10 GB the repository gets would otherwise
          # fill with branch caches nobody reads again.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  installers:
    name: Setup (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One disk image for Intel and Apple silicon: both built on Apple
          # silicon (the runner images for Intel Macs come and go) and joined.
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu, so the packages and the portable
          # folder run on anything as new or newer.
          - name: linux-x64
            os: ubuntu-22.04
            target: ''
          # Natively on ARM, same Ubuntu: nothing has to be cross-linked.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: ''
          # The setup most people run. `pnpm release --build-windows` can still
          # build it on Lorin's machine instead.
          - name: windows-x64
            os: windows-latest
            target: ''
          # Natively on ARM: ring's assembly wants clang for this target, which
          # the ARM runner brings, and nothing has to be cross-linked.
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
      # Reads the OBS plugin's artifact from this run while it is running.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libdbus-1-dev: BlueZ, for chest straps paired with the desktop.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config patchelf file libfuse2 xdg-utils

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the setup
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # No plugin for Linux on ARM.
          UWUPULSE_OBS_ARTIFACT: ${{ matrix.name != 'linux-arm64' && format('uwupulse-obs-{0}', matrix.name) || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TARGET" ]; then
            node scripts/build-setup.mjs --target "$TARGET"
          else
            node scripts/build-setup.mjs
          fi
          ls -la target/installers

      # The setup unpacks what it carries into a scratch folder and checks the
      # app arrived startable — the part of an install no window is needed
      # for. The universal one runs as arm64 here, its Intel half is checked
      # for being there. The Windows setup has no such mode and is checked by
      # what it was built from.
      - name: Check what the setup carries
        if: runner.os == 'macOS' || matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -e
          check="$RUNNER_TEMP/payload-check"
          if [ "$RUNNER_OS" = "macOS" ]; then
            setup=target/installers/UwUPulse-update-macos-universal
            chmod +x "$setup"
            lipo "$setup" -verify_arch arm64 x86_64
            "$setup" --check-payload "$check"
            for app in "$check"/*.app; do
              codesign --verify --deep --strict "$app"
              lipo "$app"/Contents/MacOS/* -verify_arch arm64 x86_64
              echo "signed, universal: $app"
            done
            plugin=$(find "$check/obs" -path '*uwupulse.plugin/Contents/MacOS/uwupulse')
            lipo "$plugin" -verify_arch arm64 x86_64
            echo "OBS plugin, universal: $plugin"
          else
            setup=target/installers/UwUPulse-update-linux-x64.AppImage
            "$setup" --check-payload "$check"
            ldd "$check/UwUPulse/usr/bin/"* | grep "not found" && exit 1 || echo "every library found"
            find "$check/obs" -path '*uwupulse/bin/64bit/uwupulse.so' | grep -q .
          fi

      # The .deb installs through dpkg as package `uwupulse` (what the app checks
      # before it updates itself), the .rpm is named the same, and the portable
      # folder has everything it needs next to it. No display here, so no start.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.name == 'linux-arm64' && 'arm64' || 'x64' }}
        run: |
          set -e
          arch="$ARCH"
          sudo apt-get install -y ./target/installers/UwUPulse-linux-$arch.deb
          test -f /var/lib/dpkg/info/uwupulse.list
          grep -qx /usr/bin/uwupulse-desktop /var/lib/dpkg/info/uwupulse.list
          grep -q '^Name=UwUPulse$' /usr/share/applications/uwupulse.desktop
          ldd /usr/bin/uwupulse-desktop | grep "not found" && exit 1 || echo "every library found"
          sudo apt-get remove -y uwupulse
          test ! -e /usr/bin/uwupulse-desktop

          sudo apt-get install -y rpm
          test "$(rpm -qp --queryformat '%{NAME}' target/installers/UwUPulse-linux-$arch.rpm)" = uwupulse
          rpm -qpl target/installers/UwUPulse-linux-$arch.rpm | grep -qx /usr/bin/uwupulse-desktop

          portable="$RUNNER_TEMP/portable"
          mkdir -p "$portable"
          tar -xzf target/installers/UwUPulse-linux-$arch-portable.tar.gz -C "$portable"
          test "$(ls "$portable")" = UwUPulse
          test -x "$portable/UwUPulse/uwupulse" && test -x "$portable/UwUPulse/AppRun"
          test -f "$portable/UwUPulse/README.txt"
          LD_LIBRARY_PATH="$portable/UwUPulse/usr/lib" ldd "$portable/UwUPulse/usr/bin/uwupulse-desktop" \
            | grep "not found" && exit 1 || echo "every library found"

      # The OBS plugin on its own: a folder for ~/.config/obs-studio/plugins and
      # package uwupulse-obs in the system's paths. Not installed: it needs OBS
      # 31 from the OBS PPA, which this Ubuntu doesn't have.
      - name: Check the OBS plugin downloads
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -e
          # Listings first: grep -q stops reading early, and pipefail would
          # count the writer's broken pipe as a failure.
          files=$(tar -tzf target/installers/UwUPulse-obs-linux-x64.tar.gz)
          test "$(cut -d/ -f1 <<<"$files" | sort -u)" = uwupulse
          grep -qx uwupulse/bin/64bit/uwupulse.so <<<"$files"
          deb=target/installers/UwUPulse-obs-linux-x64.deb
          test "$(dpkg-deb -f "$deb" Package)" = uwupulse-obs
          grep -q 'obs-studio (>= 31)' <<<"$(dpkg-deb -f "$deb" Depends)"
          contents=$(dpkg-deb -c "$deb")
          grep -q ' ./usr/lib/x86_64-linux-gnu/obs-plugins/uwupulse.so$' <<<"$contents"
          grep -q ' ./usr/share/obs/obs-plugins/uwupulse/locale/en-US.ini$' <<<"$contents"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.name }}
          path: target/installers/*
          if-no-files-found: error
          retention-days: 14
