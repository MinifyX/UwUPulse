name: Release

# On a tag `v<version>`: the desktop app for macOS (Apple silicon and Intel),
# Windows (x64 and ARM64) and Linux (.deb for x64 and arm64, Arch package for
# x64), all natively on their own runners, then one GitHub release with every
# file. Unsigned. The iPhone and Watch apps go to TestFlight / the App Store
# from apple/scripts/testflight.sh instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # Cross-compiled on Apple silicon: Intel runners come and go.
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          # The oldest supported Ubuntu, so the package runs on anything newer.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf file

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}

      - name: Build
        shell: bash
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          version="${REF#v}"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          bundle="target/$TARGET/release/bundle"
          case "$NAME" in
            macos-*)   cp "$bundle"/dmg/*.dmg "$out/UwUPulse-$version-$NAME.dmg" ;;
            windows-*) cp "$bundle"/nsis/*-setup.exe "$out/UwUPulse-$version-$NAME-setup.exe" ;;
            linux-*)   cp "$bundle"/deb/*.deb "$out/UwUPulse-$version-$NAME.deb" ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Arch package
    needs: desktop
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-x64
          path: deb
      # The PKGBUILD repackages the .deb, as the AUR's uwupulse-bin does; the
      # local file stands in for the download, so the sum is the real one.
      - name: makepkg
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          version="${REF#v}"
          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD "$work/"
          cp deb/*.deb "$work/UwUPulse-$version-linux-x64.deb"
          sed -i "s/^pkgver=.*/pkgver=${version//-/_}/; s/^_ver=.*/_ver=$version/" "$work/PKGBUILD"
          chown -R builder "$work"
          su builder -c "cd $work && updpkgsums && makepkg --nodeps --noconfirm"
          mkdir -p out
          cp "$work"/*.pkg.tar.zst "out/UwUPulse-$version-arch-x64.pkg.tar.zst"
          cp "$work/PKGBUILD" out/PKGBUILD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-arch
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub release
    needs: [desktop, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          version="${REF#v}"
          # The section of CHANGELOG.md for this version as the release notes.
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          (cd files && sha256sum * > SHA256SUMS)
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release upload "$REF" files/* --clobber
          else
            gh release create "$REF" files/* --title "UwUPulse $version" --notes-file notes.md \
              $([[ "$version" == *-* ]] && echo --prerelease)
          fi
